<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML → JSO Converter</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Inter, system-ui, sans-serif; background: #0b0f14; color: #e8edf3; }
    .wrap { width: min(1000px, calc(100% - 32px)); margin: auto; padding: 42px 0; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 42px); }
    .sub { margin: 0 0 28px; color: #9aa7b5; }
    .card { background: #111821; border: 1px solid #253140; border-radius: 18px; padding: 20px; margin-bottom: 18px; }
    label { display: block; margin-bottom: 9px; font-size: 14px; font-weight: 700; color: #cbd5e1; }
    textarea { width: 100%; min-height: 190px; resize: vertical; border: 1px solid #2a3746; border-radius: 12px; background: #0a0f15; color: #e8edf3; padding: 13px 14px; outline: none; font: 14px/1.55 ui-monospace, monospace; }
    textarea:focus { border-color: #6b7f96; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    button { border: 0; border-radius: 10px; padding: 11px 16px; cursor: pointer; background: #e8edf3; color: #0b0f14; font-weight: 750; }
    button.secondary { background: #202b38; color: #e8edf3; border: 1px solid #334254; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .hint, .status { color: #8f9cab; font-size: 13px; line-height: 1.5; }
    .hint { margin-top: 10px; }
    .status { min-height: 22px; margin-top: 12px; }
    .output { min-height: 230px; }
    .tag { min-height: 80px; }
    @media (max-width: 700px) { .wrap { width: min(100% - 20px, 1000px); padding: 25px 0; } }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>HTML → JSO</h1>
    <p class="sub">Convert HTML menjadi loader JavaScript dan langsung simpan online.</p>

    <section class="card">
      <label for="inputHtml">HTML INPUT</label>
      <textarea id="inputHtml" placeholder="Paste HTML di sini..."></textarea>
      <div class="actions">
        <button id="convertBtn">Convert to JSO</button>
        <button id="clearBtn" class="secondary">Clear</button>
      </div>
    </section>

    <section class="card">
      <label for="outputJso">JSO OUTPUT — DECIMAL CHAR CODES</label>
      <textarea id="outputJso" class="output" readonly placeholder="Contoh: 60,33,68,79,..."></textarea>
      <div class="actions">
        <button id="publishBtn" disabled>Publish .js</button>
        <button id="downloadBtn" class="secondary" disabled>Download .js</button>
        <button id="copyJsoBtn" class="secondary" disabled>Copy JSO</button>
      </div>
    </section>

    <section class="card">
      <label for="scriptTag">SCRIPT TAG</label>
      <textarea id="scriptTag" class="tag" readonly placeholder="&lt;script src=https://convert-virid.vercel.app/jso/xxxxxxxx.js&gt;&lt;/script&gt;"></textarea>
      <div class="actions">
        <button id="copyTagBtn" class="secondary" disabled>Copy Tag</button>
      </div>
      <div class="hint">Publish membuat file benar-benar tersedia di <code>/jso/&lt;id&gt;.js</code>. Jadi URL ini bisa langsung dibaca oleh browser atau dipakai sebagai script tag.</div>
      <div id="status" class="status"></div>
    </section>
  </main>

  <script>
    const input = document.getElementById('inputHtml');
    const output = document.getElementById('outputJso');
    const scriptTag = document.getElementById('scriptTag');
    const status = document.getElementById('status');
    const publishBtn = document.getElementById('publishBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const copyJsoBtn = document.getElementById('copyJsoBtn');
    const copyTagBtn = document.getElementById('copyTagBtn');

    let lastFilename = '';

    function convertJSO() {
      const value = input.value;
      if (!value) {
        output.value = '';
        status.textContent = 'Masukkan HTML terlebih dahulu.';
        return;
      }

      const codes = Array.from(value, ch => ch.codePointAt(0));
      output.value = codes.join(',');
      lastFilename = createFilename(value);
      publishBtn.disabled = false;
      downloadBtn.disabled = false;
      copyJsoBtn.disabled = false;
      copyTagBtn.disabled = true;
      scriptTag.value = '';
      status.textContent = `${codes.length.toLocaleString('id-ID')} karakter dikonversi → ${lastFilename}`;
    }

    function createFilename(value) {
      let hash = 2166136261;
      for (const ch of value) {
        hash ^= ch.codePointAt(0);
        hash = Math.imul(hash, 16777619);
      }
      return (hash >>> 0).toString(16).padStart(8, '0') + '.js';
    }

    function jsoSource() {
      return `document.write(String.fromCodePoint(${output.value}));\n`;
    }

    function downloadJS() {
      if (!output.value) return;
      const blob = new Blob([jsoSource()], { type: 'application/javascript;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = lastFilename || 'jso.js';
      a.click();
      URL.revokeObjectURL(url);
      status.textContent = `File ${a.download} berhasil diunduh.`;
    }

    async function publishJS() {
      if (!output.value) return;
      publishBtn.disabled = true;
      status.textContent = 'Menyimpan JSO ke server...';

      try {
        const response = await fetch('/api/create-jso', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source: jsoSource() })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.message || data.error || 'Publish gagal');

        lastFilename = data.filename;
        const fullUrl = new URL(data.url, window.location.origin).href;
        scriptTag.value = `<script src=${fullUrl}><\/script>`;
        copyTagBtn.disabled = false;
        status.textContent = `Berhasil dipublish: ${fullUrl}`;
      } catch (error) {
        status.textContent = `Gagal publish: ${error.message}`;
      } finally {
        publishBtn.disabled = false;
      }
    }

    async function copyText(value, message) {
      try {
        await navigator.clipboard.writeText(value);
        status.textContent = message;
      } catch {
        status.textContent = 'Gagal menyalin otomatis. Silakan copy manual.';
      }
    }

    document.getElementById('convertBtn').onclick = convertJSO;
    document.getElementById('clearBtn').onclick = () => {
      input.value = ''; output.value = ''; scriptTag.value = ''; lastFilename = '';
      publishBtn.disabled = true; downloadBtn.disabled = true; copyJsoBtn.disabled = true; copyTagBtn.disabled = true;
      status.textContent = '';
    };
    publishBtn.onclick = publishJS;
    downloadBtn.onclick = downloadJS;
    copyJsoBtn.onclick = () => copyText(output.value, 'Deretan angka berhasil disalin.');
    copyTagBtn.onclick = () => copyText(scriptTag.value, 'Script tag berhasil disalin.');
  </script>
</body>
</html>
